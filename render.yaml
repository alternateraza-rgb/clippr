services:
  - type: web
    name: clipmuse-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CLIP_WORKER_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      # Residential proxy URL. Set this and the worker downloads with yt-dlp
      # directly instead of paying Apify — without it, Render's datacenter IP
      # gets 403'd by YouTube.
      - key: YTDLP_PROXY
        sync: false
      # Cloudflare R2, where finished clips are written. All four or none —
      # with any missing the worker silently writes to Supabase Storage
      # instead, which is where the egress bill came from.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
