services:
  - type: web
    name: clipmuse-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CLIP_WORKER_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
