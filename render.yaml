services:
  - type: web
    name: clipmuse-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CLIP_WORKER_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      # Residential proxy URL. Set this and the worker downloads with yt-dlp
      # directly instead of paying Apify — without it, Render's datacenter IP
      # gets 403'd by YouTube.
      - key: YTDLP_PROXY
        sync: false
